name: Temporary broky V2 source fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_fetch_trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          python -m pip install -q --upgrade "yt-dlp[default,curl-cffi]"

      - name: Fetch second-pass public editing sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          : > out/fetch.log

          grab() {
            local name="$1"; shift
            echo "===== ${name} =====" | tee -a out/fetch.log
            yt-dlp --no-warnings --no-playlist \
              --format "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 --remux-video mp4 \
              --output "out/${name}.%(ext)s" \
              "$@" 2>&1 | tee -a out/fetch.log || true
          }

          # Direct public Reddit fallback MP4s: known broky clutch sources.
          curl -L --fail --retry 3 --retry-delay 2 \
            -o out/01_broky_1v4_astralis_2022.mp4 \
            "https://v.redd.it/3a9d4we9t4vg1/CMAF_1080.mp4?source=fallback" \
            2>&1 | tee -a out/fetch.log || true
          curl -L --fail --retry 3 --retry-delay 2 \
            -o out/02_broky_1v4_g2.mp4 \
            "https://v.redd.it/i3v48ayx4w7h1/CMAF_1080.mp4?source=fallback" \
            2>&1 | tee -a out/fetch.log || true

          # PGL / ESL / PGL-highlight mirrors on YouTube.
          grab "03_antwerp_broky_pgl" "https://www.youtube.com/watch?v=-i8QyJiM55I"
          grab "04_chengdu_2024_mvp" "https://www.youtube.com/watch?v=M_4iBLZ79Xc"
          grab "05_shanghai_2024_final_highlights" "https://www.youtube.com/watch?v=LvcfSP2PUPI"

          # Short BLAST-origin gameplay mirror, useful as unlabeled connective action.
          grab "06_broky_blast_prefire" "https://www.dailymotion.com/video/xa2ton8"
          grab "07_broky_clutch_dm" "https://www.dailymotion.com/video/x9s9870"

          # Valve-hosted Budapest Major 2025 clip retained as an official bridge.
          curl -L --fail --retry 3 --retry-delay 2 \
            -o out/08_budapest_2025_broky_triple.webm \
            "https://cdn.steamstatic.com/apps/csgo/videos/highlightreels/025/061v106_005/025_061v106_005_de_nuke_bud2025_qf-broky-triple-kill-on-nuke_ww_1080p.webm" \
            2>&1 | tee -a out/fetch.log || true

          find out -maxdepth 1 -type f -printf '%f\t%s\n' | sort > out/files.txt
          : > out/ffprobe.jsonl
          for f in out/*; do
            [ -f "$f" ] || continue
            case "$f" in *.mp4|*.webm|*.mkv)
              ffprobe -v error -show_entries format=filename,duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$f" >> out/ffprobe.jsonl 2>/dev/null || true;;
            esac
          done
          cat out/files.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-public-sources-pass2
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
